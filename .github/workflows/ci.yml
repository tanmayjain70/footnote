name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The pgvector image rather than plain postgres: the schema needs the
        # vector extension, and a suite that passes without it would be
        # testing a different database from the one that ships.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+psycopg://footnote_app:app_ci@localhost:5432/footnote_test
      DATABASE_ADMIN_URL: postgresql+psycopg://footnote_owner:owner_ci@localhost:5432/footnote_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      ENVIRONMENT: test
      # Hashed embeddings keep the suite hermetic: no 65 MB model download,
      # no network, identical vectors on every run. The real model is
      # exercised by the seed and the smoke test, not by unit tests.
      EMBEDDING_PROVIDER: hashed
      LLM_PROVIDER: stub
      WORKER_ENABLED: "false"

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Two roles, as in production: the owner runs migrations, the app serves
      # requests. A single superuser would let the suite pass while the
      # least-privilege guarantee quietly did not hold. The extension is
      # created here, as the superuser, because that is who may create it.
      - name: Bootstrap database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE ROLE footnote_owner LOGIN PASSWORD 'owner_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE;
            CREATE ROLE footnote_app LOGIN PASSWORD 'app_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE;
          "
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE DATABASE footnote_test OWNER footnote_owner;
          "
          psql -h localhost -U postgres -d footnote_test -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS vector;
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            GRANT CONNECT ON DATABASE footnote_test TO footnote_app;
            GRANT USAGE ON SCHEMA public TO footnote_app;
            GRANT CREATE ON SCHEMA public TO footnote_owner;
          "

      - name: Assert the runtime role is not privileged
        run: |
          result=$(psql -h localhost -U postgres -tAc \
            "SELECT rolsuper OR rolcreatedb FROM pg_roles WHERE rolname='footnote_app';")
          if [ "$result" != "f" ]; then
            echo "::error::footnote_app is privileged"
            exit 1
          fi

      - name: Run migrations
        run: alembic upgrade head

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      # The models and the migration must not drift apart. Autogenerate should
      # find nothing to do; if it does, somebody changed a model and forgot.
      - name: Models match the migrations
        run: |
          alembic revision --autogenerate -m "ci drift check" --rev-id cicheck
          if grep -qE "op\.(create_table|add_column|drop_column|alter_column|create_index|drop_index)" \
              alembic/versions/cicheck_ci_drift_check.py; then
            echo "::error::models have drifted from the migrations"
            cat alembic/versions/cicheck_ci_drift_check.py
            exit 1
          fi
          rm alembic/versions/cicheck_ci_drift_check.py

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
